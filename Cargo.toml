[package]
name = "imgeditor"
version = "4.2.0"
edition = "2024"
rust-version = "1.96"

[features]
default = ["native-dialogs"]
native-dialogs = ["dep:rfd"]
bench = []

[lib]
name = "imgeditor"
path = "src/lib.rs"

[[example]]
name = "benchmark_cancel_latency"
required-features = ["bench"]

[[example]]
name = "benchmark_export"
required-features = ["bench"]

[[example]]
name = "benchmark_stress"
required-features = ["bench"]

[dependencies]
anyhow = "1.0"
chrono = "0.4"
compact_str = "0.8"
dark-light = "2"
glam = { version = "0.29", features = ["bytemuck"] }
iced = { version = "0.14", features = ["tokio", "lazy", "advanced", "highlighter", "image", "svg"] }
iced_aw = { version = "0.14.1", features = ["menu", "tabs", "context_menu", "card"] }
iced_fonts = { version = "0.3.0", features = ["lucide"] }
image = { version = "0.25", default-features = false, features = ["png", "dds", "bmp", "tga"] }
memmap2 = "0.9"
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smallvec = "1"
thiserror = "1.0"
tokio = { version = "1.40", features = ["rt-multi-thread", "sync"] }
ureq = "2"
webbrowser = "1"
rfd = { version = "0.15", default-features = false, features = ["tokio", "common-controls-v6"], optional = true }
bytemuck = { version = "1", features = ["derive"] }
bitflags = "2"
fuzzt = { version = "0.3.1", default-features = false, features = ["jaro"] }
iced_widget = { version = "0.14", features = ["wgpu", "canvas"] }
log = "0.4"
pollster = "0.4"
wgpu = { version = "27", default-features = false, features = ["wgsl", "vulkan"] }
quick_cache = { version = "0.7.0", features = ["stats"] }
texpresso = { version = "2.0.2", features = ["rayon"] }
quantette = { version = "0.6.0", default-features = false, features = ["kmeans", "threads"] }

[dev-dependencies]
tempfile = "3"
iced_runtime = "0.14"

[build-dependencies]
embed-resource = "2"

[profile.release]
lto = "thin"
codegen-units = 16
opt-level = 3
panic = "abort"
strip = "symbols"

[[example]]
name = "probe_filecreate"
required-features = ["bench"]
